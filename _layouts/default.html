<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">SomeRandomStranger123</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/projects' | relative_url }}">Projects</a>
        <a href="{{ '/cheat_sheets' | relative_url }}">Cheat Sheets</a>
        <a href="{{ '/writeups' | relative_url }}">Writeups</a>
        <a href="https://github.com/SomeRandomStranger123" target="_blank" rel="noopener">GitHub ↗</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <article class="content">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ site.time | date: '%Y' }} SomeRandomStranger123 · Built with Jekyll &amp; GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
